name: Build Single Target Fast

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Tên Target cần build'
        required: true
        default: 'MATEKF405'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -D TARGET=${{ github.event.inputs.target_name }}

      - name: Build HEX (Chỉ build đúng 1 Target)
        run: |
          cmake --build build --target ${{ github.event.inputs.target_name }}

      - name: Upload HEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_name }}-HEX
          path: build/**/*.hex
